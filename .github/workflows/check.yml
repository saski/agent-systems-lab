name: check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Validate code and Compose
        run: make check
      - name: Validate specifications
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict
      - name: Start container environment
        run: make telemetry-up
      - name: Exercise isolation, revocation, and workflow
        run: LAB_CONTAINER_TESTS=1 LAB_OTEL_TESTS=1 uv run --locked pytest tests/test_containers.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100 gateway db otel-collector
      - name: Stop disposable services
        if: always()
        run: make telemetry-down
